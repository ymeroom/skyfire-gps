name: Auto Multi-Station Timelapse Capture (13 站)

# ⚠️ 安全性：本 repo 為 PUBLIC，且本 workflow 可能在自架 runner (個人電腦) 上
# 執行。絕對不要為本 workflow 加上 pull_request 觸發 —— 任何人 fork 後開 PR
# 就能在你的機器上執行任意程式碼。僅有 schedule 與 workflow_dispatch，後者
# 需要 repo 寫入權限，外部人士無法觸發。
on:
  schedule:
    # GitHub 排程延遲常達 1-4 小時，且 YouTube 直播 DVR 只保留 ~4 小時 ——
    # 事件後才觸發的 cron 常撈不到、或只撈到已入夜被暗夜閘門封頂的影格。
    # 策略：cron 設在事件前 ~2.5 小時，job 進來後「睡到 T+45 分」再擷取
    # (capture_timelapse_multi_station.py 內建，上限 4h)，讓排程延遲被 sleep
    # 吸收、擷取時刻仍落在暮光內、DVR 回溯只有 ~45–85 分鐘。
    # 每時段 2 個提早 cron (防 GitHub 偶爾整個略過一次) + 1 個 late backstop
    # (延遲 >4h 時退回事後 DVR 回溯，通常已被暗夜閘門封頂但聊勝於無)。
    #
    # 日出 (事件約 05:35 台灣)
    - cron: '5 19 * * *'    # 03:05 台灣 (提早 ~2.5h，job 睡到 ~06:20 台灣)
    - cron: '50 19 * * *'   # 03:50 台灣 (提早 ~2h)
    - cron: '30 0 * * *'    # 08:30 台灣 (backstop)
    # 日落 (事件約 18:08 台灣)
    - cron: '40 7 * * *'    # 15:40 台灣 (提早 ~2.5h，job 睡到 ~18:53 台灣)
    - cron: '25 8 * * *'    # 16:25 台灣 (提早 ~1.75h)
    - cron: '10 13 * * *'   # 21:10 台灣 (backstop)
  workflow_dispatch:
    inputs:
      session:
        description: '縮時時段 (sunset 或 sunrise)'
        required: true
        default: 'sunset'
        type: choice
        options:
          - sunset
          - sunrise

permissions:
  # 需要 write 才能把 13 站校準樣本 (data/multi-station-records.json) 與
  # canonical 影格 (data/snapshots/) commit 回 main。與 auto_validate_capture.yml
  # 一樣，本 workflow 只有 schedule/workflow_dispatch 觸發，外部人無法觸發。
  contents: write

jobs:
  multi-station-timelapse:
    # 本工具走 yt-dlp DVR sq 回溯直接擷取 (與 capture-validation.js 的
    # Tier A 同一套機制)，需要住宅 IP 通過 YouTube bot check。未設定
    # CAPTURE_RUNNER 時用 GitHub 託管 runner，Tier A 擷取失敗的個別影格
    # 會誠實記錄錯誤原因，不影響同一站的其他影格或其他站點。
    runs-on: ${{ vars.CAPTURE_RUNNER || 'ubuntu-latest' }}
    # 提早的 cron 進來後最多睡 4h 等擷取窗，加擷取/合併/推送 ~10 分鐘
    timeout-minutes: 260
    defaults:
      run:
        shell: bash
    env:
      TZ: Asia/Taipei

    steps:
      - name: 📥 檢出程式碼庫 (Checkout)
        uses: actions/checkout@v5

      - name: 🔧 補上 Git Bash 路徑 (自架 Windows runner)
        if: runner.os == 'Windows'
        shell: cmd
        run: echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"

      - name: 🌅 解析本次縮時時段
        id: session
        env:
          MANUAL_SESSION: ${{ inputs.session }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$MANUAL_SESSION" ]; then
            SESSION="$MANUAL_SESSION"
          else
            # cron 的小時欄 (UTC)：18-23 或 00 → 日出 (台灣凌晨)；其餘 → 日落 (台灣午後)
            HOUR="$(echo "$EVENT_SCHEDULE" | awk '{print $2}')"
            case "$HOUR" in
              18|19|20|21|22|23|0|00) SESSION="sunrise" ;;
              *)                      SESSION="sunset" ;;
            esac
          fi
          echo "value=$SESSION" >> "$GITHUB_OUTPUT"
          echo "Resolved timelapse session: $SESSION (schedule='$EVENT_SCHEDULE')"

      - name: 🛠️ 安裝相依工具 (GitHub 託管 Linux runner)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip3 install --break-system-packages yt-dlp pillow numpy

      - name: 🐍 解析 Python 執行檔
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          echo "PYTHON_BIN=$PY" >> "$GITHUB_ENV"
          echo "使用 $PY: $($PY --version 2>&1)"

      - name: 🗓️ 解析擷取日期 (台灣時區)
        id: date
        run: echo "value=$(date +%F)" >> "$GITHUB_OUTPUT"

      - name: 🎞️ 執行多機位縮時擷取 (T-40 ~ T+40，每 10 分鐘一張)
        run: |
          "$PYTHON_BIN" scripts/capture_timelapse_multi_station.py "${{ steps.session.outputs.value }}" "${{ steps.date.outputs.value }}"

      # 產出寫入 data/timelapse/ (已加入 .gitignore)，不進版控/不 commit。
      # 改上傳成 workflow artifact，這樣不必登進 runner 本機就能下載當日的
      # report.html (圖片已內嵌 base64，單檔即可看) + 原始幀 + JSON 評分。
      # 只打包「本次日期+時段」的產出，不含 runner 上累積的歷史日期。
      - name: 📤 上傳當日縮時產出 (report.html + 原始幀 + JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timelapse-${{ steps.date.outputs.value }}-${{ steps.session.outputs.value }}
          path: |
            data/timelapse/${{ steps.date.outputs.value }}-${{ steps.session.outputs.value }}-report.html
            data/timelapse/${{ steps.date.outputs.value }}-${{ steps.session.outputs.value }}.json
            data/timelapse/${{ steps.date.outputs.value }}-${{ steps.session.outputs.value }}/
          if-no-files-found: warn
          retention-days: 30

      # 把各站「暮光窗口峰值」實測跟鎖定預測配對寫進 multi-station-records.json，
      # 再用最新樣本重建當日日報，然後 commit + push。
      #
      # merge 與 briefing 都是「從已 commit 狀態 + 本次縮時擷取輸出 (data/timelapse/，
      # 未進版控)」的決定性重建，所以推送衝突時只要「硬同步 origin → 重跑重建 →
      # 重新 commit」即可，永遠不會有 rebase 衝突。merge 對同一站「取證據較強者」，
      # 較晚跑的失敗補跑不會洗掉較早跑的成功結果。
      - name: 🔗 合併校準樣本 + 刷新日報 + 提交 (Commit & Push)
        env:
          SESSION: ${{ steps.session.outputs.value }}
          DATE: ${{ steps.date.outputs.value }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [SkyFire Multi-Station Bot]"

          rebuild() {
            node scripts/merge-multi-station-calibration.js "$SESSION" "$DATE"
            "$PYTHON_BIN" scripts/generate_daily_briefing.py "$SESSION" "$DATE" || true
            git add data/multi-station-records.json data/snapshots data/daily-reports.json || true
          }

          for i in 1 2 3 4 5; do
            git fetch origin main -q
            git reset --hard origin/main -q     # 丟掉前次嘗試的 commit；未進版控的 data/timelapse/ 擷取輸出保留
            rebuild
            if git diff --staged --quiet; then
              echo "沒有新的校準樣本 / 報告無變化，略過 commit。"; exit 0
            fi
            git commit -m "chore(calibration): record 13-station timelapse ground truth [skip ci]"
            git push origin HEAD:main && exit 0
            echo "push 第 $i 次失敗 (origin 有新 commit)，重抓後重建再試…"; sleep 5
          done
          echo "::error::多次重試後仍無法 push 13 站校準樣本"; exit 1
