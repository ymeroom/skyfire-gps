name: Auto Multi-Station Timelapse Capture (13 站)

# ⚠️ 安全性：本 repo 為 PUBLIC，且本 workflow 可能在自架 runner (個人電腦) 上
# 執行。絕對不要為本 workflow 加上 pull_request 觸發 —— 任何人 fork 後開 PR
# 就能在你的機器上執行任意程式碼。僅有 schedule 與 workflow_dispatch，後者
# 需要 repo 寫入權限，外部人士無法觸發。
on:
  schedule:
    # 日出 T-40 ~ T+40 全部窗口關閉後補跑 (台灣時間約 07:00，涵蓋 8 個日出機位；
    # 13 站分散全台，各站日出時刻可差 10-20 分鐘，07:00 留足夠餘裕)
    - cron: '0 23 * * *'
    # 日落 T-40 ~ T+40 全部窗口關閉後補跑 (台灣時間約 19:15，涵蓋 6 個日落機位)
    - cron: '15 11 * * *'
  workflow_dispatch:
    inputs:
      session:
        description: '縮時時段 (sunset 或 sunrise)'
        required: true
        default: 'sunset'
        type: choice
        options:
          - sunset
          - sunrise

permissions:
  # 需要 write 才能把 13 站校準樣本 (data/multi-station-records.json) 與
  # canonical 影格 (data/snapshots/) commit 回 main。與 auto_validate_capture.yml
  # 一樣，本 workflow 只有 schedule/workflow_dispatch 觸發，外部人無法觸發。
  contents: write

jobs:
  multi-station-timelapse:
    # 本工具走 yt-dlp DVR sq 回溯直接擷取 (與 capture-validation.js 的
    # Tier A 同一套機制)，需要住宅 IP 通過 YouTube bot check。未設定
    # CAPTURE_RUNNER 時用 GitHub 託管 runner，Tier A 擷取失敗的個別影格
    # 會誠實記錄錯誤原因，不影響同一站的其他影格或其他站點。
    runs-on: ${{ vars.CAPTURE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      TZ: Asia/Taipei

    steps:
      - name: 📥 檢出程式碼庫 (Checkout)
        uses: actions/checkout@v5

      - name: 🔧 補上 Git Bash 路徑 (自架 Windows runner)
        if: runner.os == 'Windows'
        shell: cmd
        run: echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"

      - name: 🌅 解析本次縮時時段
        id: session
        env:
          MANUAL_SESSION: ${{ inputs.session }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$MANUAL_SESSION" ]; then
            SESSION="$MANUAL_SESSION"
          elif [ "$EVENT_SCHEDULE" = "0 23 * * *" ]; then
            SESSION="sunrise"
          else
            SESSION="sunset"
          fi
          echo "value=$SESSION" >> "$GITHUB_OUTPUT"
          echo "Resolved timelapse session: $SESSION"

      - name: 🛠️ 安裝相依工具 (GitHub 託管 Linux runner)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip3 install --break-system-packages yt-dlp pillow numpy

      - name: 🐍 解析 Python 執行檔
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          echo "PYTHON_BIN=$PY" >> "$GITHUB_ENV"
          echo "使用 $PY: $($PY --version 2>&1)"

      - name: 🗓️ 解析擷取日期 (台灣時區)
        id: date
        run: echo "value=$(date +%F)" >> "$GITHUB_OUTPUT"

      - name: 🎞️ 執行多機位縮時擷取 (T-40 ~ T+40，每 10 分鐘一張)
        run: |
          "$PYTHON_BIN" scripts/capture_timelapse_multi_station.py "${{ steps.session.outputs.value }}" "${{ steps.date.outputs.value }}"

      # 產出寫入 data/timelapse/ (已加入 .gitignore)，不進版控/不 commit。
      # 改上傳成 workflow artifact，這樣不必登進 runner 本機就能下載當日的
      # report.html (圖片已內嵌 base64，單檔即可看) + 原始幀 + JSON 評分。
      # 只打包「本次日期+時段」的產出，不含 runner 上累積的歷史日期。
      - name: 📤 上傳當日縮時產出 (report.html + 原始幀 + JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timelapse-${{ steps.date.outputs.value }}-${{ steps.session.outputs.value }}
          path: |
            data/timelapse/${{ steps.date.outputs.value }}-${{ steps.session.outputs.value }}-report.html
            data/timelapse/${{ steps.date.outputs.value }}-${{ steps.session.outputs.value }}.json
            data/timelapse/${{ steps.date.outputs.value }}-${{ steps.session.outputs.value }}/
          if-no-files-found: warn
          retention-days: 30

      # 把各站「暮光窗口峰值」實測跟 lock-forecast-multi.js 事前鎖定的預測配對，
      # 寫成 data/multi-station-records.json 供每週校準一併讀入。canonical 影格
      # 複製一份到 data/snapshots/ (進版控) 供日後人工比對評分器。
      - name: 🔗 合併 13 站校準樣本
        run: |
          node scripts/merge-multi-station-calibration.js "${{ steps.session.outputs.value }}" "${{ steps.date.outputs.value }}"

      - name: 🚀 提交 13 站校準樣本 (Commit & Push)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [SkyFire Multi-Station Bot]"
          git add data/multi-station-records.json data/snapshots/ || true
          if git diff --staged --quiet; then
            echo "沒有新的校準樣本，略過 commit。"
            exit 0
          fi
          git commit -m "chore(calibration): record 13-station timelapse ground truth [skip ci]"
          # 排程 bot 也會 push data/，撞到 non-fast-forward 就 rebase 重試。
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "push 第 $i 次失敗，5 秒後重試…"; sleep 5
          done
          echo "::error::多次重試後仍無法 push 13 站校準樣本"; exit 1
