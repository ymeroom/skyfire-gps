name: Lock Forecast Prediction

# 2026-09-11 起排程觸發改走本機 Windows 工作排程器 (見
# scripts/local-trigger/README.md)，此處只留 workflow_dispatch 供手動
# 測試/補跑；GitHub schedule 常有 1-4 小時相關性延遲，本機用電腦自己的
# 時鐘觸發不受影響。
on:
  workflow_dispatch:
    inputs:
      session:
        description: '鎖定的時段 (sunset 或 sunrise)'
        required: true
        default: 'sunset'
        type: choice
        options:
          - sunset
          - sunrise

permissions:
  contents: write

jobs:
  lock-forecast:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Lock Forecast Script
        env:
          MANUAL_SESSION: ${{ inputs.session }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/lock-forecast.js

      # 多機位版：對 js/spots-taiwan.js 本時段的每個聖地各鎖一份預測，
      # 供 auto_timelapse_multi_station.yml 之後跟 13 站縮時實測配對校準。
      # 與上面單站 (象山/大稻埕) 的鎖定互相獨立，一個失敗不連坐另一個。
      - name: Run Multi-Station Lock Forecast Script
        continue-on-error: true
        env:
          MANUAL_SESSION: ${{ inputs.session }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/lock-forecast-multi.js

      - name: Commit & Push Locked Forecast
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [SkyFire Bot]"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(forecast): lock prediction score in advance [skip ci]" && git push)
